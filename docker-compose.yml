services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: openex
      POSTGRES_USER: openex
      POSTGRES_PASSWORD: openex
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openex"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/openex
      SPRING_DATASOURCE_USERNAME: openex
      SPRING_DATASOURCE_PASSWORD: openex
      APP_JWT_SECRET: "openex-dev-secret-key-change-this-before-production-use-1234"
    depends_on:
      postgres:
        condition: service_healthy

  python-service:
    build: ./python-service
    ports:
      - "5001:5001"

volumes:
  pgdata: